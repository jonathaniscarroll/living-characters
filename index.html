<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Living Characters — Virtual World</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
  </script>
  <script type="module" src="./scripts/store.js"></script>
  <script type="module" src="./scripts/map.js"></script>
  <script type="module" src="./scripts/room.js"></script>
  <script type="module" src="./scripts/card.js"></script>
  <script type="module" src="./scripts/modals.js"></script>
  <script type="module" src="./scripts/upload-helpers.js"></script>

  <style>
    :root {
      --bg:#1a1a2e; --surface:#16213e; --surface2:#0f3460;
      --accent:#e94560; --accent2:#f5a623;
      --text:#eaeaea; --text-muted:#a0a0b0;
      --pin-size:52px; --radius:12px; --border:#ffffff18;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;}
    :root{--header-h:44px;--ghbar-h:36px;--map-top:80px;--card-w:320px;}
    @media(max-width:640px){
      :root{--header-h:40px;--ghbar-h:32px;--map-top:72px;--card-w:100vw;}
      .hide-mobile{display:none!important;}
    }
    #header{position:fixed;top:0;left:0;right:0;z-index:1100;background:linear-gradient(90deg,#0f3460,#16213e);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:var(--header-h);gap:4px;flex-wrap:nowrap;}
    #header h1{font-size:13px;font-weight:700;letter-spacing:.04em;flex-shrink:0;white-space:nowrap;}
    @media(max-width:640px){#header h1{font-size:11px;}}
    #header .btns{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
    #header .btns::-webkit-scrollbar{display:none;}
    .hbtn{font-size:10px;padding:4px 7px;border-radius:5px;border:none;cursor:pointer;font-family:inherit;font-weight:600;transition:opacity .15s;white-space:nowrap;flex-shrink:0;}
    @media(max-width:640px){.hbtn{font-size:9px;padding:3px 5px;}}
    .hbtn:hover{opacity:.8;}
    .hbtn.add-char{background:var(--accent);color:#fff;}
    .hbtn.add-room{background:#2d5a27;color:#90ee90;}
    .hbtn.test-room{background:#3a4f1a;color:#c8f08a;border:1px solid #7ab828;}
    .hbtn.gps-btn{background:#1a3a5c;color:#90caf9;}
    .hbtn.sim-btn{background:#3a2d5c;color:#c9b8ff;}
    .hbtn.export-btn{background:#2d5a27;color:#90ee90;}
    .hbtn.import-btn{background:#1a3a5c;color:#90caf9;}
    .hbtn.gh-load{background:#1c3a2a;color:#6fcf97;}
    .hbtn.gh-save{background:#3a2007;color:#f5a623;}
    .hbtn.toggle-mode{background:#ffffff18;color:var(--text);}
    .hbtn.day-seg{background:#ffffff10;color:var(--text-muted);border:1px solid transparent;font-size:13px;padding:3px 5px;}
    .hbtn.day-seg.active{background:rgba(245,166,35,.22);border-color:var(--accent2);color:var(--accent2);}
    .hbtn.mode-toggle{background:rgba(255,255,255,.12);color:var(--text);border:1px solid rgba(255,255,255,.18);}
    #mode-label{font-size:10px;color:var(--text-muted);}
    @media(max-width:640px){#mode-label{font-size:8px;}}
    #gps-status{font-size:9px;color:#90caf9;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
    @media(max-width:640px){#gps-status{max-width:60px;font-size:8px;}}
    #gh-bar{position:fixed;top:var(--header-h);left:0;right:0;z-index:1090;background:#0a1520;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:4px 10px;height:var(--ghbar-h);}
    #gh-bar label{font-size:9px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;}
    @media(max-width:640px){#gh-bar label{font-size:8px;}}
    #gh-token-input{flex:1;max-width:240px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:5px;padding:3px 8px;color:var(--text);font-size:11px;font-family:monospace;outline:none;}
    #gh-token-input:focus{border-color:var(--accent2);}
    #gh-token-input::placeholder{font-family:inherit;font-size:10px;color:var(--text-muted);}
    #gh-commit-input{flex:1;max-width:160px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:5px;padding:3px 8px;color:var(--text);font-size:11px;font-family:inherit;outline:none;}
    #gh-commit-input::placeholder{font-size:10px;color:var(--text-muted);}
    #gh-status{font-size:9px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;}
    #gh-status.ok{color:#6fcf97;} #gh-status.err{color:var(--accent);}
    @media(max-width:640px){#gh-token-input{max-width:120px;font-size:10px;}#gh-commit-input{max-width:100px;font-size:10px;}}

    /* Visitor / Facilitator mode visibility */
    [data-facilitator-only] { display: none !important; }
    .facilitator-mode [data-facilitator-only] { display: revert !important; }

    #map{position:fixed;top:var(--map-top);left:0;right:0;bottom:0;z-index:1;}
    #compass-panel{position:fixed;bottom:12px;left:12px;z-index:1050;background:rgba(10,15,30,.92);border:1px solid var(--border);border-radius:10px;padding:10px;width:170px;backdrop-filter:blur(8px);}
    @media(max-width:640px){#compass-panel{width:140px;padding:8px;bottom:8px;left:8px;}}
    #compass-panel h4{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:8px;}
    .compass-rose{position:relative;width:100px;height:100px;margin:0 auto 8px auto;border:2px solid #ffffff30;border-radius:50%;background:radial-gradient(circle,#16213e 60%,#0a0f1e);}
    @media(max-width:640px){.compass-rose{width:80px;height:80px;}}
    .compass-rose .north{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--accent);}
    .compass-rose .center-dot{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;background:#fff;border-radius:50%;}
    .heading-needle{position:absolute;left:50%;top:50%;width:3px;height:52px;margin-left:-1.5px;margin-top:-52px;background:var(--accent);transform-origin:50% 100%;}
    .heading-needle::before{content:'';position:absolute;left:-5px;top:-8px;border-left:6.5px solid transparent;border-right:6.5px solid transparent;border-bottom:10px solid var(--accent);}
    .compass-list{font-size:11px;display:flex;flex-direction:column;gap:5px;}
    .compass-item{display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 5px;border-radius:6px;transition:background .15s;}
    .compass-item:hover{background:rgba(255,255,255,.08);}
    .compass-arrow{font-size:16px;line-height:1;transition:transform .3s;}
    .compass-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .compass-dist{font-size:9px;color:var(--text-muted);}
    #card-panel{position:fixed;top:var(--map-top);right:0;bottom:0;width:var(--card-w);z-index:1050;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;}
    #card-panel.open{transform:translateX(0);}
    .card-header{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;}
    .card-photo-wrap{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--surface2);flex-shrink:0;border:2px solid var(--border);}
    .card-photo-wrap img{width:100%;height:100%;object-fit:cover;}
    .card-info{flex:1;min-width:0;}
    .card-name{font-size:15px;font-weight:700;margin-bottom:2px;}
    .card-mood{font-size:11px;color:var(--text-muted);}
    #card-close{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;padding:4px;}
    .card-anim-wrap{width:100%;aspect-ratio:1;background:#000;overflow:hidden;position:relative;}
    .card-anim-wrap img,.card-anim-wrap video{width:100%;height:100%;object-fit:contain;}
    #card-sprite-stage{width:100%;aspect-ratio:1;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    #card-sprite-canvas{image-rendering:pixelated;}
    .card-items{padding:10px 14px;border-top:1px solid var(--border);}
    .card-items h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:8px;}
    .items-list{display:flex;flex-wrap:wrap;gap:6px;}
    .item-chip{font-size:11px;background:var(--surface2);padding:3px 9px;border-radius:20px;border:1px solid var(--border);}
    .card-dialogue{padding:10px 14px;border-top:1px solid var(--border);}
    .card-dialogue h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:8px;}
    .dialogue-option{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px;color:var(--text);cursor:pointer;font-size:12px;font-family:inherit;transition:background .15s;}
    .dialogue-option:hover{background:#1a3050;}
    .dialogue-response{background:rgba(255,255,255,.04);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;margin-top:4px;border:1px solid var(--border);}
    .card-edit-btn{display:block;width:calc(100% - 28px);margin:10px 14px;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:11px;cursor:pointer;font-family:inherit;}
    .card-edit-btn:hover{color:var(--text);border-color:#ffffff40;}
    .card-actions{padding:8px 14px;display:flex;gap:6px;border-top:1px solid var(--border);}
    .card-act-btn{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:11px;cursor:pointer;font-family:inherit;}
    .card-act-btn:hover{background:#1a3050;}
    #room-view{position:fixed;top:var(--map-top);left:0;right:0;bottom:0;z-index:1040;background:var(--bg);display:none;flex-direction:column;}
    #room-view.open{display:flex;}
    #room-header{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px;}
    #room-back{background:none;border:1px solid var(--border);color:var(--text-muted);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;align-self:flex-start;}
    #room-title{font-size:16px;font-weight:700;}
    #room-lede{font-size:12px;color:var(--text-muted);line-height:1.4;}
    .room-toolbar{display:flex;gap:6px;flex-wrap:wrap;}
    .room-tbtn{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:inherit;}
    .room-tbtn:hover{background:#1a3050;}
    #room-stage{flex:1;position:relative;overflow:hidden;}
    #obj-inspect{position:absolute;bottom:10px;left:10px;right:10px;background:rgba(10,15,30,.92);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:none;z-index:10;}
    #obj-inspect.show{display:block;}
    .oi-name{font-size:13px;font-weight:700;margin-bottom:4px;}
    .oi-desc{font-size:11px;color:var(--text-muted);line-height:1.4;}
    #obj-list-panel{position:absolute;top:10px;right:10px;background:rgba(10,15,30,.92);border:1px solid var(--border);border-radius:10px;padding:10px;width:180px;z-index:10;display:none;}
    #obj-list-panel.show{display:block;}
    #obj-list-panel h5{font-size:9px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
    #obj-list-container{display:flex;flex-direction:column;gap:4px;}
    .obj-list-item{font-size:11px;padding:5px 8px;background:var(--surface2);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
    .obj-list-item:hover{background:#1a3050;}
    .obj-list-item .obj-del{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:0 2px;}
    #talk-panel{position:absolute;top:10px;left:10px;background:rgba(10,15,30,.95);border:1px solid var(--border);border-radius:10px;padding:12px;width:240px;z-index:12;display:none;}
    #talk-panel.show{display:block;}
    #talk-panel h5{font-size:11px;font-weight:700;margin-bottom:8px;}
    .talk-opt{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;margin-bottom:5px;color:var(--text);cursor:pointer;font-size:11px;font-family:inherit;}
    .talk-opt:hover{background:#1a3050;}
    #talk-response{font-size:11px;color:var(--accent2);margin-top:6px;line-height:1.4;display:none;}
    #talk-close{background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;float:right;margin-top:-4px;}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;}
    .overlay.open{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
    .modal h2{font-size:15px;font-weight:700;}
    .modal label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:3px;}
    .modal input,.modal textarea,.modal select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:12px;font-family:inherit;outline:none;}
    .modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent2);}
    .modal textarea{resize:vertical;min-height:70px;}
    .modal-row{display:flex;gap:8px;}
    .modal-row>*{flex:1;}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
    .mbtn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;}
    .mbtn.primary{background:var(--accent);color:#fff;}
    .mbtn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
    .mbtn.danger{background:#5a1a2a;color:var(--accent);border:1px solid var(--accent);}
    .photo-upload-area{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:border-color .2s;position:relative;}
    .photo-upload-area:hover{border-color:var(--accent2);}
    .photo-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
    .photo-preview{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--border);display:block;margin:0 auto 6px;}
    .photo-hint{font-size:10px;color:var(--text-muted);}
    #mini-map-wrap{position:relative;width:100%;height:160px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
    #mini-map{width:100%;height:100%;}
    .passage-list{display:flex;flex-direction:column;gap:6px;}
    .passage-item{display:flex;gap:6px;align-items:flex-start;}
    .passage-item select{flex:0 0 110px;}
    .passage-item textarea{flex:1;min-height:48px;}
    .passage-item .del-pass{background:none;border:none;color:var(--accent);font-size:18px;cursor:pointer;padding:4px 6px;line-height:1;}
    #twee-preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:3000;display:none;flex-direction:column;}
    #twee-preview-overlay.open{display:flex;}
    #twee-preview-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
    #twee-source{flex:1;overflow:auto;padding:16px;font-family:monospace;font-size:11px;white-space:pre;color:var(--text);background:var(--bg);}
    #toast{position:fixed;bottom:24px;right:24px;z-index:5000;background:var(--surface);border:1px solid var(--accent2);border-radius:10px;padding:10px 18px;font-size:12px;color:var(--accent2);pointer-events:none;opacity:0;transition:opacity .3s;max-width:260px;}
    #toast.show{opacity:1;}
    .mood-ring{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:.7;}}
    .pin-label{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;text-align:center;margin-top:2px;pointer-events:none;}
    .leaflet-marker-icon{background:none!important;border:none!important;}
    .char-pin-wrap{display:flex;flex-direction:column;align-items:center;}
    .char-pin-img{width:var(--pin-size);height:var(--pin-size);border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 8px #0008;background:#222;}
    .char-pin-ring{width:calc(var(--pin-size) + 10px);height:calc(var(--pin-size) + 10px);border-radius:50%;position:absolute;top:-5px;left:-5px;animation:pulse 2s infinite;pointer-events:none;}
    .sprite-pin-wrap{display:flex;flex-direction:column;align-items:center;}
    .sprite-pin-canvas{width:var(--pin-size);height:var(--pin-size);image-rendering:pixelated;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #0008;}
    .room-pin-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
    .room-pin-dot{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:3px solid var(--accent2);box-shadow:0 2px 8px #0008;display:flex;align-items:center;justify-content:center;font-size:12px;}
    .room-pin-label{font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;margin-top:2px;white-space:nowrap;}
    .sprite-editor{display:flex;flex-direction:column;gap:8px;padding:8px 0;}
    .sprite-state-row{display:flex;align-items:center;gap:8px;}
    .sprite-state-label{font-size:11px;font-weight:600;width:64px;text-transform:capitalize;}
    .sprite-frame-slot{width:48px;height:48px;border:1px dashed var(--border);border-radius:6px;overflow:hidden;background:var(--surface2);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-muted);}
    .sprite-frame-slot img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
    .sprite-frame-slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
    .sprite-chroma-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
    .ar-btn-wrap{margin-top:6px;}
    #ar-btn{display:none;width:100%;padding:9px;border-radius:9px;border:none;background:linear-gradient(135deg,#0f3460,var(--surface2));color:var(--accent2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
    #ar-status{font-size:10px;color:var(--text-muted);margin-top:4px;text-align:center;}
    .room-obj-draggable{cursor:grab;position:absolute;user-select:none;}
    .room-obj-draggable.dragging{cursor:grabbing;opacity:.8;z-index:100;}
    .room-edit-overlay{position:absolute;inset:0;z-index:50;background:rgba(245,166,35,.05);border:2px dashed var(--accent2);display:none;pointer-events:none;}
    .room-edit-overlay.active{display:block;}
  </style>
</head>
<body>

<div id="header">
  <h1>🏠 Living Characters</h1>
  <div class="btns">
    <span id="gps-status">GPS: off</span>
    <button class="hbtn gps-btn"   onclick="startGPS()">📍 GPS</button>
    <button class="hbtn sim-btn"   onclick="startSim()">🚶 Simulate</button>
    <button class="hbtn day-seg active" data-seg="morning"   onclick="setDaySegment('morning')">🌅</button>
    <button class="hbtn day-seg"        data-seg="midday"    onclick="setDaySegment('midday')">☀️</button>
    <button class="hbtn day-seg"        data-seg="afternoon" onclick="setDaySegment('afternoon')">🌤</button>
    <button class="hbtn day-seg"        data-seg="evening"   onclick="setDaySegment('evening')">🌇</button>
    <button class="hbtn day-seg"        data-seg="night"     onclick="setDaySegment('night')">🌙</button>
    <button class="hbtn test-room" data-facilitator-only onclick="spawnTestRoom()">🧪 Test Room</button>
    <button class="hbtn add-room"  data-facilitator-only onclick="openRoomModal(null)">+ Room</button>
    <button class="hbtn add-char"  data-facilitator-only onclick="openCharModal(null)">+ Character</button>
    <button class="hbtn import-btn" data-facilitator-only onclick="triggerImport()">⬆ .twee</button>
    <button class="hbtn export-btn" data-facilitator-only onclick="previewTwee()">⬇ .twee</button>
    <button class="hbtn gh-load"   data-facilitator-only onclick="ghLoad()">☁ Load</button>
    <button class="hbtn gh-save"   data-facilitator-only onclick="ghSave()">☁ Save</button>

<div id="twee-preview-overlay">

    <span style="font-size:13px;font-weight:700">📄 Twee Export</span>
    <div style="display:flex;gap:8px;">
      <button class="mbtn secondary" onclick="downloadTwee()">⬇ Download .twee</button>

  <pre id="twee-source"></pre>

<div id="toast"></div>

<!--
  Global proxy shim
  =================
  All scripts use type="module" (own scope). Inline onclick="..." attributes
  can only call window.* globals. This non-module script runs synchronously
  and proxies every function called from HTML through its module namespace
  object (window.lcMap, window.lcModals, window.lcStore, window.lcCard,
  window.lcRoom). The proxy functions lazy-resolve at call time so it does
  not matter that the modules finish loading after this block executes.
-->
<script>
  // ── Mode management ───────────────────────────────────────────────────────
  window._lcCurrentMode = 'facilitator';
  window.lcMode    = function()     { return window._lcCurrentMode; };
  window.lcSetMode = function(mode) {
    window._lcCurrentMode = mode;
    document.body.classList.toggle('facilitator-mode', mode === 'facilitator');
  };
  window.lcSetMode(window._lcCurrentMode);

  // ── map.js proxies ────────────────────────────────────────────────────────
  window.startGPS        = function()    { window.lcMap && window.lcMap.startGPS(); };
  window.startSim        = function()    { window.lcMap && window.lcMap.startSim(); };
  window.setDaySegment   = function(seg) { window.lcMap && window.lcMap.setDaySegment(seg); };
  window.spawnTestRoom   = function()    { window.lcMap && window.lcMap.spawnTestRoom(); };
  window.renderMapPins   = function()    { window.lcMap && window.lcMap.renderMapPins(); };
  window.updateCompass   = function()    { window.lcMap && window.lcMap.updateCompass(); };

  // ── modals.js proxies ─────────────────────────────────────────────────────
  window.openRoomModal   = function(id)  { window.lcModals && window.lcModals.openRoomModal(id); };
  window.closeRoomModal  = function()    { window.lcModals && window.lcModals.closeRoomModal(); };
  window.saveRoom        = function()    { window.lcModals && window.lcModals.saveRoom(); };
  window.openCharModal   = function(id)  { window.lcModals && window.lcModals.openCharModal(id); };
  window.closeCharModal  = function()    { window.lcModals && window.lcModals.closeCharModal(); };
  window.saveChar        = function()    { window.lcModals && window.lcModals.saveCharacter(); };
  window.deleteChar      = function()    { window.lcModals && window.lcModals.deleteChar && window.lcModals.deleteChar(); };
  window.openObjModal    = function(id)  { window.lcModals && window.lcModals.openObjModal(id); };
  window.closeObjModal   = function()    { window.lcModals && window.lcModals.closeObjModal(); };
  window.saveObj         = function()    { window.lcModals && window.lcModals.saveObject(); };
  window.deleteObj       = function()    { window.lcModals && window.lcModals.deleteObject(); };
  window.addPassage      = function()    { window.lcModals && window.lcModals.addPassage && window.lcModals.addPassage(); };
  window.editActiveRoom  = function()    { window.lcModals && window.lcModals.openRoomModal(window.activeRoomId || null); };
  window.enableRoomEdit  = function()    { window.lcRoom   && window.lcRoom.enableRoomEdit && window.lcRoom.enableRoomEdit(); };

  // ── store.js proxies ──────────────────────────────────────────────────────
  window.ghLoad          = function()    { window.lcStore && window.lcStore.ghLoad(); };
  window.ghSave          = function()    { window.lcStore && window.lcStore.ghSave(); };
  window.onTokenInput    = function()    {
    const val = document.getElementById('gh-token-input').value.trim();
    if (val) localStorage.setItem('lc_gh_token', val);
    window.lcStore && window.lcStore.validateToken(val);
  };
  window.previewTwee     = function()    {
    const src = window.lcStore && window.lcStore.buildTweeSource ? window.lcStore.buildTweeSource() : '';
    const el = document.getElementById('twee-source');
    if (el) el.textContent = src;
    document.getElementById('twee-preview-overlay').classList.add('open');
  };
  window.closeTweePreview = function()   { document.getElementById('twee-preview-overlay').classList.remove('open'); };
  window.downloadTwee    = function()    { window.lcStore && window.lcStore.exportTwee && window.lcStore.exportTwee(); };
  window.triggerImport   = function()    { document.getElementById('twee-import-input').click(); };
  window.handleImportFile = function(e)  {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => window.lcStore && window.lcStore.importTweeSource && window.lcStore.importTweeSource(ev.target.result);
    reader.readAsText(file);
  };

  // ── card.js proxies ───────────────────────────────────────────────────────
  window.closeCard       = function()    { window.lcCard && window.lcCard.closeCard(); };
  window.openCard        = function(id)  { window.lcCard && window.lcCard.openCard(id); };
  window.editCardChar    = function()    { window.lcCard && window.lcCard.editCardChar && window.lcCard.editCardChar(); };
  window.deleteCardChar  = function()    { window.lcCard && window.lcCard.deleteCardChar && window.lcCard.deleteCardChar(); };
  window.launchAR        = function()    { window.lcCard && window.lcCard.launchAR && window.lcCard.launchAR(); };

  // ── room.js proxies ───────────────────────────────────────────────────────
  window.openRoom        = function(id)  { window.lcRoom && window.lcRoom.openRoom(id); };
  window.closeRoom       = function()    { window.lcRoom && window.lcRoom.closeRoom(); };
</script>

</body>
</html>
