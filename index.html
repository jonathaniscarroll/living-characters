<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Living Characters — Virtual World</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --accent2: #f5a623;
      --text: #eaeaea;
      --text-muted: #a0a0b0;
      --pin-size: 52px;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

    /* ── HEADER ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: linear-gradient(90deg, #0f3460 0%, #16213e 100%);
      border-bottom: 1px solid #ffffff18;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 48px;
    }
    #header h1 { font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--text); }
    #header .btns { display: flex; gap: 8px; }
    .hbtn {
      font-size: 12px; padding: 5px 12px; border-radius: 6px; border: none; cursor: pointer;
      font-family: inherit; font-weight: 600; letter-spacing: .03em;
      transition: opacity .15s;
    }
    .hbtn:hover { opacity: .85; }
    .hbtn.add { background: var(--accent); color: #fff; }
    .hbtn.toggle-mode { background: #ffffff18; color: var(--text); }
    .hbtn.fullscreen { background: #ffffff10; color: var(--text-muted); }
    #mode-label { font-size: 11px; color: var(--text-muted); margin-right: 6px; }

    /* ── MAP CANVAS ── */
    #map-wrap {
      position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
      overflow: hidden; cursor: grab;
    }
    #map-wrap.dragging { cursor: grabbing; }
    #map-canvas {
      position: absolute; top: 0; left: 0;
      width: 2400px; height: 1600px;
      background: radial-gradient(ellipse at 30% 40%, #1a3a5c 0%, #0d1b2a 60%, #0a0f1e 100%);
      transform-origin: 0 0;
      user-select: none;
    }

    /* map grid lines (subtle) */
    #map-canvas::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    /* ── LOCATION LABELS ── */
    .loc-label {
      position: absolute;
      font-size: 11px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: rgba(255,255,255,.35);
      text-align: center; pointer-events: none;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .loc-zone {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,.08);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    /* ── PINS ── */
    .pin {
      position: absolute;
      width: var(--pin-size); height: var(--pin-size);
      border-radius: 50%;
      border: 3px solid var(--accent);
      overflow: hidden;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform .18s, box-shadow .18s;
      box-shadow: 0 0 0 0 var(--accent);
      background: var(--surface2);
    }
    .pin img { width: 100%; height: 100%; object-fit: cover; }
    .pin:hover { transform: translate(-50%, -50%) scale(1.18); box-shadow: 0 0 16px 4px var(--accent); }
    .pin.selected { border-color: var(--accent2); box-shadow: 0 0 20px 6px var(--accent2); transform: translate(-50%,-50%) scale(1.22); }
    .pin-label {
      position: absolute;
      bottom: calc(var(--pin-size) / 2 + 4px);
      left: 50%; transform: translateX(-50%) translateY(0);
      background: rgba(15,15,30,.85);
      color: var(--text); font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 20px;
      white-space: nowrap; pointer-events: none;
      backdrop-filter: blur(6px);
    }
    .pin-wrap { position: absolute; }

    /* ── MOOD RING ── */
    .mood-ring {
      position: absolute; inset: -5px; border-radius: 50%;
      border: 2px solid transparent;
      animation: pulse-ring 2.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: .5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    /* ── CHARACTER CARD (sidebar) ── */
    #card {
      position: fixed; right: 0; top: 48px; bottom: 0;
      width: 320px; max-width: 100vw;
      background: var(--surface);
      border-left: 1px solid #ffffff14;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .28s cubic-bezier(.16,1,.3,1);
      z-index: 150;
      overflow-y: auto;
    }
    #card.open { transform: translateX(0); }
    #card-close {
      position: absolute; top: 10px; right: 12px;
      background: none; border: none; color: var(--text-muted);
      font-size: 20px; cursor: pointer; line-height: 1;
    }
    #card-anim {
      width: 100%; aspect-ratio: 1;
      background: #0a0f1e;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    #card-anim img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #card-anim .placeholder { font-size: 64px; line-height: 1; }
    #card-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    #card-name { font-size: 20px; font-weight: 800; }
    #card-location { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
    #card-mood-row { display: flex; align-items: center; gap: 8px; }
    #card-mood-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    #card-mood-text { font-size: 13px; }
    #card-items h3, #card-dialogue h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 6px; }
    #card-items-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .item-chip {
      background: rgba(255,255,255,.08); border-radius: 20px;
      padding: 4px 10px; font-size: 12px;
    }
    #card-dialogue blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      background: rgba(255,255,255,.04);
      border-radius: 0 8px 8px 0;
      font-style: italic; font-size: 13px; line-height: 1.6;
      color: var(--text-muted);
    }
    #card-photo {
      width: 100%; aspect-ratio: 4/3;
      background: #0a0f1e;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #card-photo img { width: 100%; height: 100%; object-fit: cover; }
    .card-actions { display: flex; gap: 8px; padding: 0 16px 16px; }
    .card-btn {
      flex: 1; padding: 8px; border-radius: 8px; border: none;
      font-size: 12px; font-weight: 700; cursor: pointer;
      font-family: inherit;
    }
    .card-btn.edit { background: rgba(255,255,255,.1); color: var(--text); }
    .card-btn.delete { background: rgba(233,69,96,.15); color: var(--accent); }

    /* ── ADD / EDIT MODAL ── */
    #modal-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    #modal-overlay.open { opacity: 1; pointer-events: all; }
    #modal {
      background: var(--surface);
      border: 1px solid #ffffff18;
      border-radius: var(--radius);
      padding: 24px;
      width: 420px; max-width: calc(100vw - 32px);
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px;
    }
    #modal h2 { font-size: 16px; font-weight: 800; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
    .field input, .field select, .field textarea {
      background: rgba(255,255,255,.06); border: 1px solid #ffffff18;
      border-radius: 8px; padding: 9px 12px;
      color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color .15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 64px; }
    .field select option { background: #16213e; }
    .file-row { display: flex; gap: 8px; align-items: center; }
    .file-preview { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #0a0f1e; flex-shrink: 0; }
    .file-btn {
      flex: 1; padding: 8px 12px; border-radius: 8px;
      background: rgba(255,255,255,.06); border: 1px dashed #ffffff28;
      color: var(--text-muted); font-size: 12px; font-family: inherit;
      cursor: pointer; text-align: center;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
    .mbtn {
      flex: 1; padding: 10px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 700; cursor: pointer;
      font-family: inherit;
    }
    .mbtn.save { background: var(--accent); color: #fff; }
    .mbtn.cancel { background: rgba(255,255,255,.08); color: var(--text); }

    /* ── MOOD PICKER ── */
    .mood-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .mood-opt {
      padding: 4px 12px; border-radius: 20px; border: 1px solid transparent;
      font-size: 12px; cursor: pointer; background: rgba(255,255,255,.06);
      transition: border-color .12s, background .12s;
    }
    .mood-opt.active { border-color: var(--accent2); background: rgba(245,166,35,.15); }

    /* ── PROJECTOR MODE ── */
    body.projector #card { display: none; }
    body.projector #header .hbtn.add { display: none; }

    /* ── TOOLTIP on hover ── */
    #tooltip {
      position: fixed; z-index: 500;
      background: rgba(10,15,30,.92); backdrop-filter: blur(8px);
      border: 1px solid #ffffff18; border-radius: 10px;
      padding: 10px 14px; pointer-events: none;
      opacity: 0; transition: opacity .12s;
      max-width: 220px;
    }
    #tooltip.show { opacity: 1; }
    #tooltip .tt-name { font-size: 13px; font-weight: 800; }
    #tooltip .tt-loc { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    #tooltip .tt-mood { font-size: 11px; margin-top: 3px; }

    /* ── LOCATION PICKER in modal ── */
    #loc-picker-wrap { position: relative; }
    #loc-picker-map {
      width: 100%; height: 160px;
      background: radial-gradient(ellipse at 30% 40%, #1a3a5c, #0a0f1e);
      border-radius: 8px; border: 1px solid #ffffff18;
      position: relative; overflow: hidden; cursor: crosshair;
    }
    #loc-picker-map .lp-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .lp-zone-label {
      position: absolute; font-size: 9px; color: rgba(255,255,255,.3);
      text-transform: uppercase; letter-spacing: .06em; pointer-events: none;
      transform: translateX(-50%);
    }
    #lp-crosshair {
      position: absolute; width: 16px; height: 16px;
      border: 2px solid var(--accent); border-radius: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ffffff20; border-radius: 3px; }
  </style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <h1>🏠 Living Characters — Virtual World</h1>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="mode-label">Facilitator mode</span>
    <button class="hbtn toggle-mode" onclick="toggleMode()">Switch to Projector View</button>
    <button class="hbtn add" onclick="openModal(null)">+ Add Character</button>
  </div>
</div>

<!-- MAP -->
<div id="map-wrap">
  <div id="map-canvas" id="map-canvas">
    <!-- Zones and labels rendered by JS -->
  </div>
</div>

<!-- CHARACTER CARD SIDEBAR -->
<div id="card">
  <button id="card-close" onclick="closeCard()">&#x2715;</button>
  <div id="card-anim"><div class="placeholder">🧸</div></div>
  <div id="card-body">
    <div>
      <div id="card-name"></div>
      <div id="card-location"></div>
    </div>
    <div id="card-mood-row">
      <div id="card-mood-dot"></div>
      <div id="card-mood-text"></div>
    </div>
    <div id="card-items">
      <h3>Items</h3>
      <div id="card-items-list"></div>
    </div>
    <div id="card-dialogue">
      <h3>Says</h3>
      <blockquote id="card-quote"></blockquote>
    </div>
    <div id="card-photo"></div>
  </div>
  <div class="card-actions">
    <button class="card-btn edit" onclick="editSelected()">Edit</button>
    <button class="card-btn delete" onclick="deleteSelected()">Remove</button>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">Add a Character</h2>

    <div class="field">
      <label>Character name</label>
      <input id="f-name" type="text" placeholder="e.g. Mop, Gravel, Biscuit..." />
    </div>

    <div class="field">
      <label>Character photo (felting / clay)</label>
      <div class="file-row">
        <img id="f-photo-preview" class="file-preview" src="" style="display:none" />
        <label class="file-btn" for="f-photo-input">Upload photo (JPG / PNG)</label>
        <input id="f-photo-input" type="file" accept="image/*" style="display:none" onchange="previewFile('f-photo-input','f-photo-preview','photoData')" />
      </div>
    </div>

    <div class="field">
      <label>Mixamo animation (GIF or image)</label>
      <div class="file-row">
        <img id="f-anim-preview" class="file-preview" src="" style="display:none" />
        <label class="file-btn" for="f-anim-input">Upload Mixamo GIF / PNG</label>
        <input id="f-anim-input" type="file" accept="image/gif,image/png,image/jpeg" style="display:none" onchange="previewFile('f-anim-input','f-anim-preview','animData')" />
      </div>
      <small style="font-size:11px;color:var(--text-muted);margin-top:4px;">From <a href="https://www.mixamo.com" target="_blank" style="color:var(--accent2)">mixamo.com</a> → download as GIF or screenshot the animation preview.</small>
    </div>

    <div class="field">
      <label>Mood</label>
      <div class="mood-picker" id="mood-picker">
        <!-- rendered by JS -->
      </div>
    </div>

    <div class="field">
      <label>Location on the map — click to place</label>
      <div id="loc-picker-map">
        <div class="lp-grid"></div>
        <!-- zone labels + crosshair rendered by JS -->
        <div id="lp-crosshair" style="display:none"></div>
      </div>
      <input id="f-loc-x" type="hidden" />
      <input id="f-loc-y" type="hidden" />
      <small id="f-loc-label" style="font-size:11px;color:var(--text-muted);margin-top:4px;">Click the map above to choose a spot.</small>
    </div>

    <div class="field">
      <label>Items (comma-separated)</label>
      <input id="f-items" type="text" placeholder="e.g. small hat, acorn, lucky pebble" />
    </div>

    <div class="field">
      <label>What does this character say?</label>
      <textarea id="f-dialogue" placeholder="A short line of dialogue or a thought..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="mbtn cancel" onclick="closeModal()">Cancel</button>
      <button class="mbtn save" onclick="saveCharacter()">Save</button>
    </div>
  </div>
</div>

<!-- TOOLTIP -->
<div id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-loc" id="tt-loc"></div>
  <div class="tt-mood" id="tt-mood"></div>
</div>

<script>
/* ═══════════════════════════════════════
   DATA
═══════════════════════════════════════ */
const MOODS = [
  { label: 'Happy', color: '#4ade80', emoji: '😊' },
  { label: 'Sleepy', color: '#818cf8', emoji: '😴' },
  { label: 'Hungry', color: '#fb923c', emoji: '🍽️' },
  { label: 'Grumpy', color: '#f87171', emoji: '😤' },
  { label: 'Curious', color: '#38bdf8', emoji: '🔍' },
  { label: 'Shy', color: '#e879f9', emoji: '🫣' },
  { label: 'Excited', color: '#fbbf24', emoji: '⚡' },
  { label: 'Cozy', color: '#a78bfa', emoji: '🌙' },
];

const ZONES = [
  { name: 'The Lobby', x: 0.22, y: 0.30, r: 0.10 },
  { name: 'The Kitchen', x: 0.52, y: 0.20, r: 0.09 },
  { name: 'The Garden', x: 0.78, y: 0.55, r: 0.11 },
  { name: 'The Workshop', x: 0.20, y: 0.68, r: 0.10 },
  { name: 'The Rooftop', x: 0.60, y: 0.75, r: 0.09 },
  { name: 'The Library', x: 0.42, y: 0.50, r: 0.08 },
];

let characters = JSON.parse(localStorage.getItem('lc_chars') || '[]');
let selectedId = null;
let editingId = null;
let activeMood = MOODS[0].label;
let tempPhotoData = null;
let tempAnimData = null;
let lpX = null, lpY = null;

// Map pan/zoom
let scale = 0.55, panX = 0, panY = 0;
let dragging = false, dragStart = { x: 0, y: 0 }, panStart = { x: 0, y: 0 };

const MAP_W = 2400, MAP_H = 1600;

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function init() {
  buildMapZones();
  buildMoodPicker();
  buildLocPickerZones();
  renderAll();
  initMapInteraction();
  // center map
  const wrap = document.getElementById('map-wrap');
  panX = (wrap.clientWidth - MAP_W * scale) / 2;
  panY = (wrap.clientHeight - MAP_H * scale) / 2;
  applyTransform();
}

/* ═══════════════════════════════════════
   MAP ZONES
═══════════════════════════════════════ */
function buildMapZones() {
  const canvas = document.getElementById('map-canvas');
  ZONES.forEach(z => {
    const px = z.x * MAP_W, py = z.y * MAP_H;
    const rw = z.r * MAP_W, rh = z.r * MAP_H;
    // zone ring
    const ring = document.createElement('div');
    ring.className = 'loc-zone';
    ring.style.cssText = `left:${px}px;top:${py}px;width:${rw*2}px;height:${rh*2}px;`;
    canvas.appendChild(ring);
    // label
    const lbl = document.createElement('div');
    lbl.className = 'loc-label';
    lbl.textContent = z.name;
    lbl.style.cssText = `left:${px}px;top:${py - rh - 14}px;`;
    canvas.appendChild(lbl);
  });
}

/* ═══════════════════════════════════════
   RENDER PINS
═══════════════════════════════════════ */
function renderAll() {
  // remove old pins
  document.querySelectorAll('.pin-wrap').forEach(p => p.remove());
  characters.forEach(ch => renderPin(ch));
}

function renderPin(ch) {
  const canvas = document.getElementById('map-canvas');
  const mood = MOODS.find(m => m.label === ch.mood) || MOODS[0];
  const px = ch.x * MAP_W;
  const py = ch.y * MAP_H;

  const wrap = document.createElement('div');
  wrap.className = 'pin-wrap';
  wrap.style.cssText = `position:absolute;left:${px}px;top:${py}px;`;

  const pin = document.createElement('div');
  pin.className = 'pin' + (selectedId === ch.id ? ' selected' : '');
  pin.dataset.id = ch.id;

  if (ch.photoData) {
    const img = document.createElement('img');
    img.src = ch.photoData;
    img.alt = ch.name;
    pin.appendChild(img);
  } else {
    pin.style.display = 'flex';
    pin.style.alignItems = 'center';
    pin.style.justifyContent = 'center';
    pin.style.fontSize = '24px';
    pin.textContent = '🧸';
  }

  // mood ring
  const ring = document.createElement('div');
  ring.className = 'mood-ring';
  ring.style.borderColor = mood.color;
  pin.appendChild(ring);

  pin.addEventListener('click', (e) => { e.stopPropagation(); selectCharacter(ch.id); });
  pin.addEventListener('mouseenter', (e) => showTooltip(e, ch));
  pin.addEventListener('mouseleave', hideTooltip);
  pin.addEventListener('mousemove', (e) => moveTooltip(e));

  // label
  const lbl = document.createElement('div');
  lbl.className = 'pin-label';
  lbl.style.position = 'absolute';
  lbl.style.bottom = 'calc(26px + 6px)';
  lbl.style.left = '50%';
  lbl.style.transform = 'translateX(-50%)';
  lbl.textContent = ch.name;

  wrap.appendChild(pin);
  wrap.appendChild(lbl);
  canvas.appendChild(wrap);
}

/* ═══════════════════════════════════════
   SELECT / CARD
═══════════════════════════════════════ */
function selectCharacter(id) {
  selectedId = id;
  const ch = characters.find(c => c.id === id);
  if (!ch) return;
  // highlight
  document.querySelectorAll('.pin').forEach(p => p.classList.remove('selected'));
  const pin = document.querySelector(`.pin[data-id="${id}"]`);
  if (pin) pin.classList.add('selected');
  // fill card
  const mood = MOODS.find(m => m.label === ch.mood) || MOODS[0];
  document.getElementById('card-name').textContent = ch.name;
  document.getElementById('card-location').textContent = nearestZone(ch.x, ch.y);
  document.getElementById('card-mood-dot').style.background = mood.color;
  document.getElementById('card-mood-text').textContent = mood.emoji + ' ' + mood.label;
  // animation
  const animEl = document.getElementById('card-anim');
  if (ch.animData) {
    animEl.innerHTML = `<img src="${ch.animData}" alt="${ch.name} animation" />`;
  } else {
    animEl.innerHTML = '<div class="placeholder">🧸</div>';
  }
  // photo
  const photoEl = document.getElementById('card-photo');
  if (ch.photoData) {
    photoEl.innerHTML = `<img src="${ch.photoData}" alt="${ch.name}" />`;
  } else {
    photoEl.innerHTML = '';
  }
  // items
  const itemsList = document.getElementById('card-items-list');
  itemsList.innerHTML = '';
  (ch.items || []).forEach(it => {
    const chip = document.createElement('span');
    chip.className = 'item-chip';
    chip.textContent = it;
    itemsList.appendChild(chip);
  });
  // dialogue
  document.getElementById('card-quote').textContent = ch.dialogue || '...';
  document.getElementById('card').classList.add('open');
}

function closeCard() {
  document.getElementById('card').classList.remove('open');
  selectedId = null;
  document.querySelectorAll('.pin').forEach(p => p.classList.remove('selected'));
}

function nearestZone(x, y) {
  let best = null, bestD = Infinity;
  ZONES.forEach(z => {
    const d = Math.hypot(x - z.x, y - z.y);
    if (d < bestD) { bestD = d; best = z.name; }
  });
  return best || 'The World';
}

/* ═══════════════════════════════════════
   TOOLTIP
═══════════════════════════════════════ */
const tt = document.getElementById('tooltip');
function showTooltip(e, ch) {
  const mood = MOODS.find(m => m.label === ch.mood) || MOODS[0];
  document.getElementById('tt-name').textContent = ch.name;
  document.getElementById('tt-loc').textContent = nearestZone(ch.x, ch.y);
  document.getElementById('tt-mood').textContent = mood.emoji + ' ' + mood.label;
  tt.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e) {
  tt.style.left = (e.clientX + 14) + 'px';
  tt.style.top = (e.clientY - 20) + 'px';
}
function hideTooltip() { tt.classList.remove('show'); }

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
function buildMoodPicker() {
  const picker = document.getElementById('mood-picker');
  MOODS.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'mood-opt' + (m.label === activeMood ? ' active' : '');
    btn.textContent = m.emoji + ' ' + m.label;
    btn.style.borderColor = m.color;
    btn.onclick = () => {
      activeMood = m.label;
      document.querySelectorAll('.mood-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    picker.appendChild(btn);
  });
}

function openModal(id) {
  editingId = id;
  tempPhotoData = null;
  tempAnimData = null;
  lpX = null; lpY = null;
  document.getElementById('modal-title').textContent = id ? 'Edit Character' : 'Add a Character';
  if (id) {
    const ch = characters.find(c => c.id === id);
    document.getElementById('f-name').value = ch.name;
    document.getElementById('f-items').value = (ch.items || []).join(', ');
    document.getElementById('f-dialogue').value = ch.dialogue || '';
    activeMood = ch.mood || MOODS[0].label;
    document.querySelectorAll('.mood-opt').forEach(b => {
      b.classList.toggle('active', b.textContent.includes(activeMood));
    });
    if (ch.photoData) { document.getElementById('f-photo-preview').src = ch.photoData; document.getElementById('f-photo-preview').style.display = ''; tempPhotoData = ch.photoData; }
    if (ch.animData) { document.getElementById('f-anim-preview').src = ch.animData; document.getElementById('f-anim-preview').style.display = ''; tempAnimData = ch.animData; }
    lpX = ch.x; lpY = ch.y;
    updateLocLabel();
    updateLPCrosshair();
  } else {
    document.getElementById('f-name').value = '';
    document.getElementById('f-items').value = '';
    document.getElementById('f-dialogue').value = '';
    document.getElementById('f-photo-preview').style.display = 'none';
    document.getElementById('f-anim-preview').style.display = 'none';
    activeMood = MOODS[0].label;
    document.querySelectorAll('.mood-opt').forEach((b, i) => b.classList.toggle('active', i === 0));
    document.getElementById('f-loc-label').textContent = 'Click the map above to choose a spot.';
    document.getElementById('lp-crosshair').style.display = 'none';
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function previewFile(inputId, previewId, dataKey) {
  const file = document.getElementById(inputId).files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = e.target.result;
    if (dataKey === 'photoData') tempPhotoData = data;
    else tempAnimData = data;
    const img = document.getElementById(previewId);
    img.src = data; img.style.display = '';
  };
  reader.readAsDataURL(file);
}

function saveCharacter() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Please give this character a name.'); return; }
  if (lpX === null) { alert('Please click the map to choose a location.'); return; }
  const items = document.getElementById('f-items').value.split(',').map(s => s.trim()).filter(Boolean);
  const dialogue = document.getElementById('f-dialogue').value.trim();

  if (editingId) {
    const ch = characters.find(c => c.id === editingId);
    ch.name = name; ch.items = items; ch.dialogue = dialogue;
    ch.mood = activeMood; ch.x = lpX; ch.y = lpY;
    if (tempPhotoData) ch.photoData = tempPhotoData;
    if (tempAnimData) ch.animData = tempAnimData;
  } else {
    characters.push({ id: Date.now() + '', name, mood: activeMood, x: lpX, y: lpY, items, dialogue, photoData: tempPhotoData, animData: tempAnimData });
  }
  save();
  renderAll();
  closeModal();
  if (editingId) selectCharacter(editingId);
}

function editSelected() { if (selectedId) openModal(selectedId); }

function deleteSelected() {
  if (!selectedId) return;
  if (!confirm('Remove this character from the world?')) return;
  characters = characters.filter(c => c.id !== selectedId);
  save(); renderAll(); closeCard();
}

function save() { localStorage.setItem('lc_chars', JSON.stringify(characters)); }

/* ═══════════════════════════════════════
   LOCATION PICKER (mini-map in modal)
═══════════════════════════════════════ */
function buildLocPickerZones() {
  const lpm = document.getElementById('loc-picker-map');
  ZONES.forEach(z => {
    const lbl = document.createElement('div');
    lbl.className = 'lp-zone-label';
    lbl.textContent = z.name;
    lbl.style.left = (z.x * 100) + '%';
    lbl.style.top = (z.y * 100) + '%';
    lpm.appendChild(lbl);
  });
  lpm.addEventListener('click', (e) => {
    const rect = lpm.getBoundingClientRect();
    lpX = (e.clientX - rect.left) / rect.width;
    lpY = (e.clientY - rect.top) / rect.height;
    updateLPCrosshair();
    updateLocLabel();
  });
}

function updateLPCrosshair() {
  if (lpX === null) return;
  const lpm = document.getElementById('loc-picker-map');
  const ch = document.getElementById('lp-crosshair');
  ch.style.display = '';
  ch.style.left = (lpX * lpm.clientWidth) + 'px';
  ch.style.top = (lpY * lpm.clientHeight) + 'px';
}

function updateLocLabel() {
  if (lpX === null) return;
  document.getElementById('f-loc-label').textContent = '📍 ' + nearestZone(lpX, lpY);
}

/* ═══════════════════════════════════════
   MAP PAN / ZOOM
═══════════════════════════════════════ */
function applyTransform() {
  document.getElementById('map-canvas').style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
}

function initMapInteraction() {
  const wrap = document.getElementById('map-wrap');

  wrap.addEventListener('mousedown', (e) => {
    if (e.target.closest('.pin')) return;
    dragging = true; wrap.classList.add('dragging');
    dragStart = { x: e.clientX, y: e.clientY };
    panStart = { x: panX, y: panY };
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    panX = panStart.x + (e.clientX - dragStart.x);
    panY = panStart.y + (e.clientY - dragStart.y);
    applyTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; wrap.classList.remove('dragging'); });

  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const oldScale = scale;
    scale = Math.max(0.25, Math.min(2.0, scale - e.deltaY * 0.001));
    panX += (mx - panX) * (1 - scale / oldScale);
    panY += (my - panY) * (1 - scale / oldScale);
    applyTransform();
  }, { passive: false });

  // touch pan
  let lastTouch = null;
  wrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY, px: panX, py: panY };
  });
  wrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && lastTouch) {
      e.preventDefault();
      panX = lastTouch.px + (e.touches[0].clientX - lastTouch.x);
      panY = lastTouch.py + (e.touches[0].clientY - lastTouch.y);
      applyTransform();
    }
  }, { passive: false });

  // click on blank map closes card
  wrap.addEventListener('click', (e) => {
    if (!e.target.closest('.pin')) closeCard();
  });
}

/* ═══════════════════════════════════════
   PROJECTOR / FACILITATOR TOGGLE
═══════════════════════════════════════ */
let projectorMode = false;
function toggleMode() {
  projectorMode = !projectorMode;
  document.body.classList.toggle('projector', projectorMode);
  document.getElementById('mode-label').textContent = projectorMode ? 'Projector mode' : 'Facilitator mode';
  document.querySelector('.hbtn.toggle-mode').textContent = projectorMode ? 'Switch to Facilitator View' : 'Switch to Projector View';
  if (projectorMode) closeCard();
}
