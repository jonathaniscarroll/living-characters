name: Dev Preview Deploy

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dev-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Build static site into dev/ subfolder
        run: |
          mkdir -p _site/dev
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='todo' \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='story' \
            --exclude='vendor/tweego' \
            --exclude='*.vsix' \
            --exclude='vspackage' \
            --exclude='copilot.vsix' \
            --exclude='localStorage.json' \
            . _site/dev/

      - name: Verify output
        run: |
          test -f _site/dev/index.html
          echo "Site files:"
          ls -la _site/dev/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-current
          fetch-depth: 0

      - name: Merge dev into gh-pages/dev
        run: |
          rm -rf gh-pages-current/dev
          cp -r _site/dev gh-pages-current/dev

      - name: Push updated gh-pages
        run: |
          cd gh-pages-current
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev/
          git diff --cached --quiet || git commit -m "Deploy dev preview [skip ci]"
          git push
