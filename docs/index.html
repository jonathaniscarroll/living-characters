<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Living Characters — Wiki</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #16213e;
      --surface2: #1a2a4a;
      --accent: #e94560;
      --accent2: #f5a623;
      --text: #eaeaea;
      --text-muted: #8899aa;
      --border: #ffffff18;
      --nav-w: 240px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }

    /* ── Layout ── */
    #shell { display: flex; min-height: 100vh; }
    #sidebar {
      width: var(--nav-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #topbar {
      background: linear-gradient(90deg, #0f3460, #16213e);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    #topbar h1 { font-size: 15px; font-weight: 800; letter-spacing: .04em; }
    #topbar a {
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: color .15s, border-color .15s;
    }
    #topbar a:hover { color: var(--accent2); border-color: var(--accent2); }
    #content-wrap {
      flex: 1;
      padding: 48px 56px;
      max-width: 860px;
      width: 100%;
    }

    /* ── Sidebar ── */
    #sidebar-header {
      padding: 18px 16px 10px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--text-muted);
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }
    #nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: block;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: background .12s, color .12s;
      border: none;
      background: none;
      text-align: left;
      font-family: var(--font);
      width: 100%;
    }
    .nav-item:hover { background: rgba(255,255,255,.06); color: var(--text); }
    .nav-item.active { background: rgba(245,166,35,.14); color: var(--accent2); }
    .nav-section {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      padding: 12px 12px 4px;
      font-weight: 700;
    }
    #sidebar-footer {
      margin-top: auto;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    #sidebar-footer a { color: var(--accent2); text-decoration: none; }

    /* ── Content / Markdown ── */
    #content {
      line-height: 1.75;
      font-size: 15px;
      color: var(--text);
    }
    #content h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; color: var(--text); }
    #content h2 {
      font-size: 18px; font-weight: 700; margin-top: 40px; margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      color: var(--accent2);
    }
    #content h3 { font-size: 15px; font-weight: 700; margin-top: 28px; margin-bottom: 6px; color: var(--text); }
    #content h4 { font-size: 13px; font-weight: 700; margin-top: 20px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; }
    #content p { margin-bottom: 14px; }
    #content ul, #content ol { margin: 0 0 14px 22px; }
    #content li { margin-bottom: 5px; }
    #content a { color: var(--accent2); text-decoration: none; }
    #content a:hover { text-decoration: underline; }
    #content strong { color: var(--text); }
    #content em { color: var(--text-muted); }
    #content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

    /* Code */
    #content code {
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #90ee90;
    }
    #content pre {
      background: #000510;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      overflow-x: auto;
      margin-bottom: 18px;
    }
    #content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 12.5px;
      color: #90ee90;
      line-height: 1.6;
    }

    /* Tables */
    #content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 13px;
    }
    #content th {
      background: var(--surface2);
      color: var(--accent2);
      font-weight: 700;
      text-align: left;
      padding: 9px 14px;
      border: 1px solid var(--border);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    #content td {
      padding: 8px 14px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      vertical-align: top;
    }
    #content tr:nth-child(even) td { background: rgba(255,255,255,.025); }

    /* Blockquote */
    #content blockquote {
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      background: rgba(255,255,255,.04);
      border-radius: 0 8px 8px 0;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-style: italic;
    }

    /* Loading state */
    #loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 200px; color: var(--text-muted); font-size: 14px;
      gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile */
    #menu-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font);
    }
    @media (max-width: 720px) {
      #shell { flex-direction: column; }
      #sidebar {
        width: 100%;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      #nav { display: none; }
      #nav.open { display: flex; }
      #menu-toggle { display: block; }
      #content-wrap { padding: 24px 18px; }
      #topbar { padding: 0 14px; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ffffff20; border-radius: 3px; }
  </style>
</head>
<body>
<div id="shell">

  <aside id="sidebar">
    <div id="sidebar-header">🏠 Living Characters</div>
    <nav id="nav">
      <div class="nav-section">Overview</div>
      <button class="nav-item" data-page="Home">📖 Home</button>

      <div class="nav-section">For Users</div>
      <button class="nav-item" data-page="User-Guide">🎮 User Guide</button>

      <div class="nav-section">For Developers</div>
      <button class="nav-item" data-page="Developer-Reference">⚙️ Developer Reference</button>
      <button class="nav-item" data-page="Data-Model">🗂️ Data Model</button>
      <button class="nav-item" data-page="Twee-Export">📄 Twee Export</button>
    </nav>
    <div id="sidebar-footer">
      <a href="https://github.com/jonathaniscarroll/living-characters" target="_blank">↗ GitHub repo</a><br />
      <a href="../index.html" target="_blank">↗ Open the tool</a>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <h1>Living Characters — Wiki</h1>
      <button id="menu-toggle" onclick="toggleNav()">☰ Menu</button>
      <a href="https://github.com/jonathaniscarroll/living-characters" target="_blank">GitHub ↗</a>
      <a href="../index.html" target="_blank">Open Tool ↗</a>
    </div>
    <div id="content-wrap">
      <div id="content">
        <div id="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>
  </div>

</div>

<script>
  const PAGES = {
    'Home':                 '../wiki/Home.md',
    'User-Guide':           '../wiki/User-Guide.md',
    'Developer-Reference':  '../wiki/Developer-Reference.md',
    'Data-Model':           '../wiki/Data-Model.md',
    'Twee-Export':          '../wiki/Twee-Export.md',
  };

  // Intercept internal wiki links and route them client-side
  marked.use({
    renderer: {
      link(token) {
        const href = token.href;
        const text = token.text || href;
        // Detect internal md links like User-Guide.md or ./User-Guide.md
        const mdMatch = href.match(/(?:\.\/)?([-\w]+)\.md$/);
        if (mdMatch && PAGES[mdMatch[1]]) {
          return `<a href="#" data-wiki="${mdMatch[1]}">${text}</a>`;
        }
        return `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
      }
    }
  });

  async function loadPage(name) {
    const url = PAGES[name];
    if (!url) return;

    // Update nav active state
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.page === name);
    });

    // Show loading
    document.getElementById('content').innerHTML =
      '<div id="loading"><div class="spinner"></div> Loading…</div>';

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      document.getElementById('content').innerHTML = marked.parse(md);
      // Wire up internal links
      document.querySelectorAll('#content a[data-wiki]').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          loadPage(a.dataset.wiki);
          history.pushState({ page: a.dataset.wiki }, '', '#' + a.dataset.wiki);
        });
      });
      // Scroll to top
      document.getElementById('content-wrap').scrollTop = 0;
      window.scrollTo(0, 0);
      // Update page title
      document.title = name.replace(/-/g, ' ') + ' — Living Characters Wiki';
    } catch (err) {
      document.getElementById('content').innerHTML =
        `<p style="color:var(--accent)">Could not load page: ${err.message}</p>`;
    }
  }

  // Nav button clicks
  document.querySelectorAll('.nav-item[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      loadPage(btn.dataset.page);
      history.pushState({ page: btn.dataset.page }, '', '#' + btn.dataset.page);
      // Close mobile nav
      document.getElementById('nav').classList.remove('open');
    });
  });

  // Mobile menu toggle
  function toggleNav() {
    document.getElementById('nav').classList.toggle('open');
  }

  // Back/forward
  window.addEventListener('popstate', e => {
    if (e.state?.page) loadPage(e.state.page);
  });

  // Initial load from hash or default to Home
  const hash = location.hash.replace('#', '');
  loadPage(PAGES[hash] ? hash : 'Home');
</script>
</body>
</html>
